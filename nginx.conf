# Para la instancia Ubuntu autorizada: proxy HTTP hacia la API local.
# La API debe estar ejecutándose en el mismo host, en 127.0.0.1:5000.
server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log;
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }
}

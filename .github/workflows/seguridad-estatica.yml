name: Seguridad estatica - Lab 5
on:
  push:
    branches: [main, security/lab-fsi]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sast:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep==1.186.0
      - name: Analizar linea base y propuesta
        run: |
          mkdir -p reports
          git worktree add /tmp/lab5-base 6a1f8839c234bbe5f4258e9868808ac3996cda35
          semgrep scan --config p/owasp-top-ten --config p/secrets --metrics off --json --output "$PWD/reports/semgrep-antes.json" /tmp/lab5-base
          semgrep scan --config p/owasp-top-ten --config p/secrets --metrics off --json --output reports/semgrep-despues.json .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: resultado-semgrep
          path: reports/semgrep-*.json
          if-no-files-found: error
  secretos:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  regresion:
    name: Regresion de acceso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  dependencias:
    name: SCA - Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: falcon_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: falcon_lab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon_app -d falcon_lab"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://falcon_app:${POSTGRES_PASSWORD}@db:5432/falcon_lab
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./web.js:/usr/share/nginx/html/web.js:ro
    depends_on:
      - api
volumes:
  pgdata:
